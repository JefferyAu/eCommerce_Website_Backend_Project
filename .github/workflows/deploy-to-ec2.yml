name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'

      # Assemble the project with Gradle Wrapper to jar file
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Build Docker image
      - name: Build Docker image
        run: docker build -t project-backend:latest .

      # Tag Docker image
      - name: Tag Docker image
        run: docker tag project-backend:latest jefferyau/project-backend:latest

      # Push Docker image
      - name: Push Docker image
        run: docker push jefferyau/project-backend:latest

      # SSH into EC2 instance and Docker Pull, Stop, Remove and Run
      - name: SSH into EC2 instance
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          script: |
            docker pull jefferyau/project-backend:latest
            docker stop project-backend || true
            docker rm project-backend || true
            docker run -d --name project-backend -p 80:80 jefferyau/project-backend:latest
